<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join CE Assessment</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 20px auto; padding: 16px; }
    button, input, textarea { width: 100%; padding: 14px; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
    h2 { color: #1e3a8a; }
  </style>
</head>
<body>
  <h2>CE Assessment</h2>
  <div id="joinArea">
    <input id="codeInput" placeholder="Enter code" />
    <button id="joinBtn">Join</button>
    <p id="status">Ready</p>
  </div>
  <div id="poll" style="display:none;">
    <h3 id="qText"></h3>
    <div id="answerArea"></div>
    <p id="answerStatus"></p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAjSdNx1bKFfhOmD6WnuVlFgaWGbR6-KI4",
      authDomain: "comm-strategy.firebaseapp.com",
      databaseURL: "https://comm-strategy-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "comm-strategy",
      storageBucket: "comm-strategy.firebasestorage.app",
      messagingSenderId: "1008243068419",
      appId: "1:1008243068419:web:31d87704cf61283a4b8836",
      measurementId: "G-P43MYP66ES"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      document.getElementById("status").textContent = "Config error";
    }

    let sessionId = null;

    // Auto-join if code is in the URL (from QR code)
    const params = new URLSearchParams(window.location.search);
    const urlCode = params.get("code");
    if (urlCode) {
      document.getElementById("codeInput").value = urlCode;
      setTimeout(() => joinSession(urlCode), 300);
    }

    document.getElementById("joinBtn").onclick = () => {
      const code = document.getElementById("codeInput").value.trim().toUpperCase();
      joinSession(code);
    };

    function joinSession(code) {
      if (!db || !code) return;
      sessionId = code.toUpperCase();
      document.getElementById("status").textContent = "Joining...";
      db.ref("sessions/" + sessionId).once("value").then(function (snap) {
        if (!snap.exists()) {
          document.getElementById("status").textContent = "Invalid code.";
          return;
        }
        document.getElementById("joinArea").style.display = "none";
        document.getElementById("poll").style.display = "block";
        listen();
      }).catch(function (err) {
        document.getElementById("status").textContent = "Error: " + err.message;
      });
    }

    function listen() {
      db.ref("sessions/" + sessionId).on("value", function (snap) {
        const data = snap.val();
        if (!data || !data.questions) return;
        const idx = data.currentIndex || 0;
        const q = data.questions[idx];
        document.getElementById("qText").textContent = q.text;
        renderAnswerArea(q, idx);
      });
    }

    function renderAnswerArea(q, questionIndex) {
      const area = document.getElementById("answerArea");
      area.innerHTML = "";
      document.getElementById("answerStatus").textContent = "";

      if (q.type === "yesno" || q.type === "yesno-correct") {
        area.innerHTML = `
          <button class="option" data-val="Yes">Yes</button>
          <button class="option" data-val="No">No</button>
        `;
      } else if (q.type === "rating") {
        area.innerHTML = [1,2,3,4,5].map(n => `<button class="option" data-val="${n}">${n}</button>`).join("");
      } else if (q.type === "open") {
        area.innerHTML = `<textarea id="openText" rows="4" placeholder="Type your answer"></textarea>
                          <button id="sendOpen">Submit</button>`;
      }

      area.querySelectorAll(".option").forEach(btn => {
        btn.onclick = () => submitAnswer(questionIndex, btn.dataset.val);
      });
      const openBtn = document.getElementById("sendOpen");
      if (openBtn) {
        openBtn.onclick = () => {
          const answer = document.getElementById("openText").value.trim();
          if (answer) submitAnswer(questionIndex, answer);
        };
      }
    }

    function submitAnswer(questionIndex, answer) {
      const voteId = Date.now().toString();
      db.ref("sessions/" + sessionId + "/votes/" + voteId).set({
        questionIndex: questionIndex,
        answer: answer
      }).then(() => {
        document.getElementById("answerStatus").textContent = "Submitted!";
      }).catch(err => {
        document.getElementById("answerStatus").textContent = "Error: " + err.message;
      });
    }
  </script>
</body>
</html>
