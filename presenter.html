<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CE Assessment</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .header {
      background: white;
      padding: 20px 40px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h1 { margin: 0; color: #1e3a8a; font-size: 1.8rem; }
    .header .subtitle { margin: 4px 0 0 0; color: #64748b; font-size: 1rem; }
    .container { display: flex; min-height: calc(100vh - 80px); }
    .left-panel {
      width: 300px;
      background: #1e3a8a;
      color: white;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .right-panel {
      flex: 1;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 680px;
    }
    .section-title { color: #1e3a8a; font-size: 1.3rem; margin: 0 0 4px 0; }
    .section-sub { color: #64748b; margin: 0 0 20px 0; font-size: 0.95rem; }
    #code { font-size: 2.6rem; font-weight: 700; letter-spacing: 2px; margin: 12px 0; }
    #qr img { border-radius: 12px; background: white; padding: 8px; }
    .join-label { font-size: 0.9rem; opacity: 0.9; }
    #questionText { font-size: 1.45rem; font-weight: 600; margin: 0 0 20px 0; line-height: 1.4; }
    .q-meta { color: #64748b; font-size: 0.85rem; margin-bottom: 6px; }
    .bar-container { margin: 14px 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; font-weight: 500; }
    .bar { background: #e2e8f0; height: 36px; border-radius: 8px; overflow: hidden; }
    .bar-fill { background: #1e3a8a; height: 100%; transition: width 0.4s ease; }
    .open-answer { background: #f8fafc; padding: 10px 14px; margin: 6px 0; border-radius: 8px; border-left: 4px solid #1e3a8a; }
    button { background: #1e3a8a; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-right: 8px; }
    button.secondary { background: #e2e8f0; color: #1e293b; }
    .nav-buttons { margin-top: 24px; }
    #setup { text-align: center; padding: 80px 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>CE Assessment</h1>
    <p class="subtitle">How you deal with Contractor on CE assessment</p>
  </div>

  <div id="setup">
    <button id="newSession">Start</button>
    <p id="status">Loading...</p>
  </div>

  <div id="session" class="container" style="display:none;">
    <div class="left-panel">
      <div id="qr"></div>
      <div class="join-label">Join code</div>
      <div id="code"></div>
    </div>
    <div class="right-panel">
      <div class="card">
        <div id="sectionInfo"></div>
        <div class="q-meta">Question <span id="qIndex">1</span> of <span id="totalQ"></span></div>
        <h2 id="questionText"></h2>
        <div id="results"></div>
        <div class="nav-buttons">
          <button id="prev" class="secondary">← Previous</button>
          <button id="next">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAjSdNx1bKFfhOmD6WnuVlFgaWGbR6-KI4",
      authDomain: "comm-strategy.firebaseapp.com",
      databaseURL: "https://comm-strategy-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "comm-strategy",
      storageBucket: "comm-strategy.firebasestorage.app",
      messagingSenderId: "1008243068419",
      appId: "1:1008243068419:web:31d87704cf61283a4b8836",
      measurementId: "G-P43MYP66ES"
    };

    let db = null;
    let sections = [];
    let flatQuestions = [];
    let sessionId = null;
    let currentIndex = 0;
    let allVotes = {};

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      document.getElementById("status").textContent = "Ready";
    } catch (e) {
      document.getElementById("status").textContent = "Config error: " + e.message;
    }

    const saved = localStorage.getItem("ce_sections");
    if (saved) {
      sections = JSON.parse(saved);
    } else {
      sections = [
        {
          title: "CE Assessment",
          subtitle: "How you deal with Contractor on CE assessment",
          questions: [
            { type: "yesno", text: "Do you agree with the current CE process?" },
            { type: "open", text: "What is your main concern?" }
          ]
        },
        {
          title: "Payment Assessment",
          subtitle: "How are the current payment assessments being conducted?",
          questions: [
            { type: "rating", text: "How clear is the payment assessment process?" },
            { type: "open", text: "Any suggestions for improvement?" }
          ]
        }
      ];
    }

    function flatten() {
      flatQuestions = [];
      sections.forEach((sec, si) => {
        sec.questions.forEach(q => {
          flatQuestions.push({ ...q, sectionIndex: si, sectionTitle: sec.title, sectionSubtitle: sec.subtitle });
        });
      });
    }
    flatten();

    document.getElementById("newSession").onclick = async function () {
      if (!db || flatQuestions.length === 0) return;
      document.getElementById("status").textContent = "Creating session...";
      try {
        sessionId = Math.random().toString(36).slice(2, 8).toUpperCase();
        await db.ref("sessions/" + sessionId).set({
          questions: flatQuestions,
          currentIndex: 0
        });
        document.getElementById("setup").style.display = "none";
        document.getElementById("session").style.display = "flex";
        document.getElementById("code").textContent = sessionId;
        document.getElementById("totalQ").textContent = flatQuestions.length;

        const joinUrl = "https://wongkekl.github.io/commstr/join.html?code=" + sessionId;
        document.getElementById("qr").innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=${encodeURIComponent(joinUrl)}" alt="QR Code">`;

        listenForVotes();
        updateQuestion();
      } catch (err) {
        document.getElementById("status").textContent = "Error: " + err.message;
      }
    };

    function listenForVotes() {
      db.ref("sessions/" + sessionId + "/votes").on("value", function (snap) {
        allVotes = snap.val() || {};
        renderResults();
      });
    }

    function updateQuestion() {
      const q = flatQuestions[currentIndex];
      document.getElementById("qIndex").textContent = currentIndex + 1;
      document.getElementById("questionText").textContent = q.text;
      document.getElementById("sectionInfo").innerHTML = `
        <div class="section-title">${q.sectionTitle}</div>
        <div class="section-sub">${q.sectionSubtitle}</div>
      `;
      if (db && sessionId) {
        db.ref("sessions/" + sessionId + "/currentIndex").set(currentIndex);
      }
      renderResults();
    }

    function renderResults() {
      const resultsDiv = document.getElementById("results");
      const q = flatQuestions[currentIndex];
      if (!q) return;

      const answers = [];
      for (const key in allVotes) {
        const vote = allVotes[key];
        if (vote.questionIndex === currentIndex) answers.push(vote.answer);
      }

      if (answers.length === 0) {
        resultsDiv.innerHTML = "<p style='color:#64748b;'>Waiting for responses...</p>";
        return;
      }

      if (q.type === "yesno" || q.type === "rating") {
        const counts = {};
        answers.forEach(a => counts[a] = (counts[a] || 0) + 1);
        const total = answers.length;
        let html = "";
        Object.keys(counts).sort().forEach(key => {
          const count = counts[key];
          const percent = Math.round((count / total) * 100);
          html += `
            <div class="bar-container">
              <div class="bar-label"><span>${key}</span><span>${percent}%</span></div>
              <div class="bar"><div class="bar-fill" style="width:${percent}%"></div></div>
            </div>`;
        });
        resultsDiv.innerHTML = html;
      } else {
        resultsDiv.innerHTML = answers.map(a => `<div class="open-answer">${a}</div>`).join("") || "<p>No responses yet.</p>";
      }
    }

    document.getElementById("next").onclick = () => {
      if (currentIndex < flatQuestions.length - 1) { currentIndex++; updateQuestion(); }
    };
    document.getElementById("prev").onclick = () => {
      if (currentIndex > 0) { currentIndex--; updateQuestion(); }
    };
  </script>
</body>
</html>
