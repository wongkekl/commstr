<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Questions</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 30px auto; padding: 20px; }
    button { padding: 8px 14px; margin: 4px; cursor: pointer; }
    input, select { width: 100%; padding: 8px; margin: 4px 0; box-sizing: border-box; }
    .section { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 16px 0; }
    .question-item { border: 1px solid #eee; padding: 10px; margin: 8px 0; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Edit Questions</h1>
  <div id="sections"></div>
  <button id="save">Save</button>
  <p id="status"></p>
  <p><a href="presenter.html">Go to Presenter</a></p>

  <script>
    let sections = [];
    const saved = localStorage.getItem("ce_sections");
    if (saved) {
      sections = JSON.parse(saved);
    } else {
      sections = [
        {
          title: "CE Assessment",
          subtitle: "How you deal with Contractor on CE assessment",
          questions: [
            { type: "yesno", text: "Do you agree with the current CE process?" },
            { type: "open", text: "What is your main concern?" }
          ]
        },
        {
          title: "Payment Assessment",
          subtitle: "How are the current payment assessments being conducted?",
          questions: [
            { type: "rating", text: "How clear is the payment assessment process?" },
            { type: "open", text: "Any suggestions for improvement?" }
          ]
        }
      ];
    }

    function render() {
      const container = document.getElementById("sections");
      container.innerHTML = "";
      sections.forEach((sec, si) => {
        const div = document.createElement("div");
        div.className = "section";
        div.innerHTML = `
          <h2>${sec.title}</h2>
          <p style="color:#64748b;margin-top:0;">${sec.subtitle}</p>
          <div id="qlist-${si}"></div>
          <button onclick="addQ(${si})">+ Add Question</button>
        `;
        container.appendChild(div);
        renderQuestions(si);
      });
    }

    function renderQuestions(si) {
      const list = document.getElementById("qlist-" + si);
      list.innerHTML = "";
      sections[si].questions.forEach((q, qi) => {
        const item = document.createElement("div");
        item.className = "question-item";
        item.innerHTML = `
          <select onchange="sections[${si}].questions[${qi}].type=this.value">
            <option value="yesno" ${q.type==="yesno"?"selected":""}>Yes / No</option>
            <option value="rating" ${q.type==="rating"?"selected":""}>Rating (1-5)</option>
            <option value="open" ${q.type==="open"?"selected":""}>Open-ended</option>
          </select>
          <input type="text" value="${q.text}" oninput="sections[${si}].questions[${qi}].text=this.value">
          <button onclick="sections[${si}].questions.splice(${qi},1);render()">Remove</button>
        `;
        list.appendChild(item);
      });
    }

    function addQ(si) {
      sections[si].questions.push({ type: "yesno", text: "New question" });
      render();
    }

    document.getElementById("save").onclick = () => {
      localStorage.setItem("ce_sections", JSON.stringify(sections));
      document.getElementById("status").textContent = "Saved. Go to the Presenter page to start.";
    };

    render();
  </script>
</body>
</html>
